apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiml-platform-models
  namespace: aiml-platform
spec:
  accessModes:
    - ReadWriteMany    # Multiple pods can read simultaneously
  storageClassName: efs-sc  # AWS EFS for shared storage; use gcs-fuse for GKE
  resources:
    requests:
      storage: 10Gi
