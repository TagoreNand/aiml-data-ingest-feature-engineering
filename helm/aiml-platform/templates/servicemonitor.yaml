apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aiml-platform
  namespace: aiml-platform
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: aiml-platform
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
