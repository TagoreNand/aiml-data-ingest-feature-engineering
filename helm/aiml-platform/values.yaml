replicaCount: 2

image:
  repository: ghcr.io/your-org/aiml-platform
  tag: latest

autoscaling:
  minReplicas: 2
  maxReplicas: 10

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
  hosts:
    - host: api.aiml-platform.example.com
      paths:
        - path: /
          pathType: Prefix
